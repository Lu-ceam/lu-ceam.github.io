# Link check for the built site.
# CI passes --root-dir and --remap so root-relative links and the production
# origin both resolve to dist/ (canonical URLs included).
verbose = "warn"
no_progress = true
include_fragments = "full"
max_retries = 2
timeout = 20
index_files = ["index.html"]

# A few shops answer the default lychee agent with 404 and a normal browser with 200.
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"

# These catalog sources sit behind a bot challenge (403 or 405). Browsers can
# open them; a link checker in CI cannot.
exclude = [
  '^https://www\\.discogs\\.com',
  '^https://www\\.prestomusic\\.com',
  '^https://natalie\\.mu',
]
