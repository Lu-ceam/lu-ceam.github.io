name: Catalog data report

# Independent, non-required reporting job. It does not gate, replace, or modify
# the existing `ci.yml` verify chain or the Pages deploy workflow, and it is not
# part of the required check set. Its final step carries the validator's real
# exit code (0 pass / 1 data issues / 2 execution or coverage incomplete); the
# report artifact is uploaded even when the audit fails, and no step uses
# continue-on-error to turn a failure green.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The validator never builds. This step only produces the explicit
      # successful build output the build layer compares against. Its failure
      # fails the job; the later steps use `if: always()` so the report and
      # artifact are still produced and the real outcome is still reported.
      - name: Build for comparison
        id: build
        run: npm run build

      # Source-only audit when there is no comparable build; source+build when
      # the build step succeeded. Both write the same report pair.
      - name: Catalog audit
        id: audit
        if: always()
        run: |
          out="$RUNNER_TEMP/catalog-report"
          if [ "${{ steps.build.outcome }}" = "success" ] && [ -d dist/records ]; then
            node --experimental-strip-types scripts/catalog-data-validator.ts audit \
              --dist dist --out "$out" --source-head "${{ github.sha }}"
          else
            node --experimental-strip-types scripts/catalog-data-validator.ts audit \
              --out "$out" --source-head "${{ github.sha }}"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-data-report
          path: |
            ${{ runner.temp }}/catalog-report/catalog-report.json
            ${{ runner.temp }}/catalog-report/catalog-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve the real result
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          echo "build=${BUILD_OUTCOME} audit=${AUDIT_OUTCOME}"
          if [ "${BUILD_OUTCOME}" != "success" ]; then
            echo "::error::comparison build failed; the build layer could not be verified"
            exit 1
          fi
          if [ "${AUDIT_OUTCOME}" != "success" ]; then
            echo "::error::catalog audit reported issues or incomplete coverage (see the catalog-data-report artifact)"
            exit 1
          fi
