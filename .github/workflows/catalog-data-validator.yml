name: Catalog data report

# Independent, non-required reporting job. It does not gate, replace, or modify
# the existing `ci.yml` verify chain or the Pages deploy workflow, and it is not
# part of the required check set. Its final step carries the validator's real
# exit code (0 pass / 1 data issues / 2 execution or coverage incomplete); the
# report artifact is uploaded even when the audit fails, and no step uses
# continue-on-error to turn a failure green.
#
# The validator never builds. The one build step below is a separate, explicit
# script that runs the existing `npm run build` and writes a receipt binding the
# output to the exact input fingerprint. Without a verifying receipt the audit
# refuses to claim build provenance (exit 2) instead of trusting mtimes.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Controlled build + receipt (acceptance F5). This is the only build step,
      # it is clearly labelled, and it records the pre-build input fingerprint and
      # the post-build output fingerprint. Its failure fails the job; later steps
      # use `if: always()` so the report and artifact are still produced.
      - name: Build for comparison and write receipt
        id: build
        run: |
          node --experimental-strip-types scripts/catalog-data-validator-build.mjs \
            --dist dist \
            --receipt "$RUNNER_TEMP/catalog-build-receipt.json"

      # Source-only audit when there is no comparable build; source+build+receipt
      # when the build step succeeded. Both write the same report pair.
      - name: Catalog audit
        id: audit
        if: always()
        run: |
          out="$RUNNER_TEMP/catalog-report"
          receipt="$RUNNER_TEMP/catalog-build-receipt.json"
          if [ "${{ steps.build.outcome }}" = "success" ] && [ -f "$receipt" ] && [ -d dist/records ]; then
            node --experimental-strip-types scripts/catalog-data-validator.ts audit \
              --dist dist --receipt "$receipt" --out "$out" --source-head "${{ github.sha }}"
          else
            node --experimental-strip-types scripts/catalog-data-validator.ts audit \
              --out "$out" --source-head "${{ github.sha }}"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-data-report
          path: |
            ${{ runner.temp }}/catalog-report/catalog-report.json
            ${{ runner.temp }}/catalog-report/catalog-report.md
            ${{ runner.temp }}/catalog-build-receipt.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve the real result
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          echo "build=${BUILD_OUTCOME} audit=${AUDIT_OUTCOME}"
          if [ "${BUILD_OUTCOME}" != "success" ]; then
            echo "::error::comparison build failed; the build layer could not be verified"
            exit 1
          fi
          if [ "${AUDIT_OUTCOME}" != "success" ]; then
            echo "::error::catalog audit reported issues or incomplete coverage (see the catalog-data-report artifact)"
            exit 1
          fi
